# What Flux watches on this cluster. Bootstrapped by the AKS Flux extension in
# infrastructure/bicep/modules/aks.bicep, and everything after that comes from git.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lgs
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/ajtang/LastGitStanding
  ref: { branch: main }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lgs
  namespace: flux-system
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: lgs }
  path: ./platform/lgs/overlays/production
  prune: true
  wait: true
  timeout: 5m
